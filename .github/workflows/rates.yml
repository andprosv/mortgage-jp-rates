name: Update mortgage rates
on:
  schedule:
    - cron: '0 21 * * *'   # 06:00 JST
    - cron: '0 9 * * *'    # 18:00 JST
  workflow_dispatch:        # ручной запуск
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i playwright
      - run: npx playwright install --with-deps chromium
      - run: node fetch_rates.mjs
      - name: commit
        run: |
          git config user.name "rates-bot"
          git config user.email "bot@users.noreply.github.com"
          git add rates.json
          git commit -m "update rates $(date -u +%F)" || echo "no changes"
          git push
